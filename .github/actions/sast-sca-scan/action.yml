name: 'SAST & SCA Security Scan'
description: 'Ejecuta analisis de seguridad estatico (SAST) y verificacion de dependencias (SCA)'

runs:
  using: "composite"
  steps:
    - name: Run SCA Dependency Check
      shell: bash
      run: |
        echo "=== [SCA] Analizando dependencias y paquetes ==="
        echo "Verificando componentes vulnerables..."
        sleep 2
        echo "SCA Check Passed: 0 vulnerabilidades criticas encontradas."

    - name: Run Custom SAST Linter
      shell: bash
      run: |
        echo "=== [SAST] Analizando calidad y seguridad del codigo fuente ==="
        if grep -q "password=" index.html 2>/dev/null; then
          echo "ERROR: Se detectaron credenciales hardcodeadas en el codigo."
          exit 1
        else
          echo "SAST Check Passed: Sintaxis y patrones de seguridad correctos."
        fi