name: 'Setup DevOps Tools'
description: 'Instala Helm y valida utilidades CLI para despliegues en AKS'

runs:
  using: "composite"
  steps:
    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: Verify Installed Tools
      shell: bash
      run: |
        echo "=== Verificando herramientas en el runner ==="
        helm version --short
        kubectl version --client --output=yaml | head -n 5
        echo "=========================================="